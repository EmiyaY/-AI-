<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态栏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: transparent;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #e8eaef;
      line-height: 1.55;
    }

    /* 主容器：深色扁平卡片，融入酒馆暗色环境 */
    .status-root {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #17181d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 12px;
    }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4ade80;
    }
    .title {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.5px;
      flex: 1;
    }
    .stage {
      font-size: 11px;
      color: #a78bfa;
      background: rgba(167, 139, 250, 0.12);
      border-radius: 6px;
      padding: 1px 8px;
      font-weight: 500;
    }
    .gear {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #a6abb4;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 7px;
      line-height: 1.4;
    }
    .gear:hover {
      color: #e8eaef;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* 设置面板 */
    .settings {
      display: none;
      padding: 10px 12px;
      margin-bottom: 12px;
      background: #1e2026;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }
    .settings.open { display: block; }
    .settings-title {
      font-size: 12px;
      font-weight: 500;
      color: #a78bfa;
      margin-bottom: 8px;
    }
    .set-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
      color: #a6abb4;
    }
    .set-field span { flex: 0 0 64px; font-weight: 500; }
    .set-field input[type="text"],
    .set-field input[type="password"] {
      flex: 1;
      background: #131418;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #e8eaef;
      padding: 6px 9px;
      font-size: 12px;
    }
    .set-field input:focus {
      outline: none;
      border-color: #8b7cf6;
    }

    /* 分组区块 */
    .section {
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 500;
      color: #a78bfa;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .kv {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 3px 0;
    }
    .kv .k {
      flex: 0 0 auto;
      color: #71767f;
      font-size: 12px;
    }
    .kv .v {
      color: #e8eaef;
      text-align: right;
      word-break: break-word;
    }

    /* 可能意外：amber 强调 */
    .section.surprise .section-title { color: #f59e0b; }
    .section.surprise .v { color: #fbbf24; }

    /* 角色卡片 */
    .char-card {
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      background: #1a1b21;
    }
    .char-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      cursor: pointer;
      user-select: none;
      border-left: 3px solid #8b7cf6;
    }
    .char-header:hover { background: #1e2026; }
    .char-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
    }
    .char-name .rel {
      font-size: 11px;
      font-weight: 400;
      color: #71767f;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .char-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .char-status {
      font-size: 11px;
      color: #a6abb4;
    }
    .char-status.off { color: #71767f; }
    .char-aff {
      font-size: 11px;
      font-weight: 500;
    }
    .toggle {
      font-size: 10px;
      color: #71767f;
      transition: transform 0.2s;
    }
    .char-card.collapsed .toggle { transform: rotate(-90deg); }

    /* 角色详情 */
    .char-details {
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: none;
    }
    .char-card:not(.collapsed) .char-details { display: block; }

    /* 好感度 */
    .aff-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .aff-label {
      flex: 0 0 auto;
      font-size: 11px;
      color: #71767f;
    }
    .aff-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
    }
    .aff-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s;
    }
    .aff-high { background: #f472b6; }
    .aff-mid { background: #fbbf24; }
    .aff-low { background: #60a5fa; }
    .aff-val {
      flex: 0 0 auto;
      font-size: 11px;
      font-weight: 500;
      color: #e8eaef;
    }

    /* 字段行 */
    .frow {
      display: flex;
      gap: 10px;
      padding: 2px 0;
      font-size: 12px;
    }
    .frow .fk {
      flex: 0 0 auto;
      color: #71767f;
    }
    .frow .fv {
      color: #c6cad2;
      word-break: break-word;
    }

    /* 详情分组标题 */
    .gtitle {
      font-size: 11px;
      font-weight: 500;
      color: #a78bfa;
      margin: 10px 0 4px;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .sub {
      font-size: 11px;
      color: #71767f;
      margin: 6px 0 2px;
      padding-left: 10px;
    }
    .kvline {
      padding: 1px 0 1px 10px;
      font-size: 12px;
      color: #c6cad2;
      word-break: break-word;
    }

    .empty {
      padding: 10px;
      color: #71767f;
      text-align: center;
      font-size: 12px;
    }

    /* 工具区 */
    .tools {
      display: flex;
      gap: 8px;
      padding-top: 4px;
    }
    .tool-btn {
      flex: 1;
      padding: 8px 0;
      background: #1e2026;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 7px;
      color: #c6cad2;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .tool-btn:hover {
      background: #24262d;
      color: #e8eaef;
    }
    .tool-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .tool-btn.small {
      flex: 0 0 auto;
      padding: 6px 14px;
      font-size: 12px;
    }
    .tool-status {
      padding: 6px 2px 0;
      font-size: 11px;
      color: #a6abb4;
      word-break: break-word;
    }
    .tool-status.error { color: #f87171; }
    .patch-box { display: none; padding-top: 8px; }
    .patch-box.open { display: block; }
    .patch-box textarea {
      width: 100%;
      background: #131418;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 7px;
      color: #e8eaef;
      font-size: 12px;
      padding: 8px;
      margin-bottom: 6px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="status-root">
    <div class="header">
      <span class="dot"></span>
      <span class="title">状态栏</span>
      <span class="stage" id="stage">—</span>
      <button class="gear" id="gear-btn" type="button" title="设置">设置</button>
    </div>

    <div class="settings" id="settings">
      <div class="settings-title">第二 API</div>
      <label class="set-field">
        <span>复用酒馆 API</span>
        <input id="cfg-use-main" type="checkbox" checked>
      </label>
      <div id="cfg-custom" style="display:none;">
        <label class="set-field"><span>API URL</span><input id="cfg-url" type="text" placeholder="https://api.openai.com/v1"></label>
        <label class="set-field"><span>API Key</span><input id="cfg-key" type="password" placeholder="sk-..."></label>
        <label class="set-field"><span>模型</span><input id="cfg-model" type="text" placeholder="gpt-4o-mini"></label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">世界信息</div>
      <div class="kv"><span class="k">时间</span><span class="v" id="info-time">—</span></div>
      <div class="kv"><span class="k">世界</span><span class="v" id="info-world">—</span></div>
      <div class="kv"><span class="k">进度</span><span class="v" id="info-progress">—</span></div>
    </div>

    <div class="section">
      <div class="section-title">当前场景</div>
      <div class="kv"><span class="k">地点</span><span class="v" id="scene-location">—</span></div>
      <div class="kv"><span class="k">环境</span><span class="v" id="scene-atmosphere">—</span></div>
      <div class="kv"><span class="k">人员</span><span class="v" id="scene-people">—</span></div>
    </div>

    <div class="section surprise">
      <div class="section-title">可能意外</div>
      <div class="kv"><span class="k">人</span><span class="v" id="surprise-person">—</span></div>
      <div class="kv"><span class="k">结果</span><span class="v" id="surprise-result">—</span></div>
    </div>

    <div id="char-list"></div>

    <div class="tools">
      <button class="tool-btn" id="btn-beautify" type="button">美化正文</button>
      <button class="tool-btn" id="btn-variable" type="button">处理变量</button>
    </div>
    <div class="tool-status" id="beautify-status"></div>
    <div class="tool-status" id="variable-status"></div>

    <div class="patch-box" id="patch-box">
      <textarea id="patch-text" readonly rows="6"></textarea>
      <button class="tool-btn small" id="btn-copy" type="button">复制 Patch</button>
    </div>
  </div>

  <script>
  /* 空值兜底 */
  function safeGet(v, def) {
    if (v === undefined || v === null || v === '') return (def === undefined ? '—' : def);
    if (Array.isArray(v)) return v.length ? v[0] : (def === undefined ? '—' : def);
    if (typeof v === 'object') return (def === undefined ? '—' : def);
    return v;
  }

  /* HTML 转义（防注入） */
  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* 获取全局函数（兼容 iframe / parent） */
  function getGlobalFn(name) {
    try { if (window.parent && typeof window.parent[name] === 'function') return window.parent[name]; } catch (e) { /* ignore */ }
    if (typeof window[name] === 'function') return window[name];
    return null;
  }

  /* 读取 MVU 变量 */
  function getMvuData() {
    if (window.__MOCK__) return window.__MOCK__;
    try {
      var TH = window.TavernHelper || (window.parent && window.parent.TavernHelper);
      if (TH && typeof TH.getVariables === 'function') {
        var v = TH.getVariables({ type: 'message', message_id: 'latest' });
        if (v) return (v.display_data || v.stat_data) || {};
      }
    } catch (e) { /* ignore */ }

    try {
      var getMsgs = getGlobalFn('getChatMessages');
      var getCur = getGlobalFn('getCurrentMessageId');
      if (getMsgs) {
        var id = getCur ? getCur() : 'latest';
        var msgs = getMsgs(id);
        if (msgs && msgs.length) {
          var d = (msgs[0] && msgs[0].data) || {};
          return (d.display_data || d.stat_data) || {};
        }
      }
    } catch (e) { /* ignore */ }

    return {};
  }

  var collapsedMap = {};

  function affinityPercent(n) { return Math.round(((n + 100) / 200) * 100); }
  function affinityClass(n) {
    if (n > 20) return 'aff-high';
    if (n >= 0) return 'aff-mid';
    return 'aff-low';
  }

  function renderKvRecord(rec) {
    var ks = Object.keys(rec || {});
    if (!ks.length) return '<div class="kvline">无</div>';
    var html = '';
    for (var i = 0; i < ks.length; i++) {
      html += '<div class="kvline">' + esc(ks[i]) + '　' + esc(rec[ks[i]]) + '</div>';
    }
    return html;
  }

  function renderItemRecord(rec) {
    var ks = Object.keys(rec || {});
    if (!ks.length) return '<div class="kvline">无</div>';
    var html = '';
    for (var i = 0; i < ks.length; i++) {
      var it = rec[ks[i]] || {};
      var desc = it['描述'] || '';
      var st = it['状态'] || '';
      var tail = (st && st !== '正常') ? '（' + esc(st) + '）' : '';
      html += '<div class="kvline">' + esc(ks[i]) + '　' + esc(desc) + tail + '</div>';
    }
    return html;
  }

  function buildCharDetails(c) {
    var body = c['身体信息'] || {};
    var outfit = c['穿搭'] || {};
    var sex = c['性爱观念'] || {};
    var html = '';

    html += '<div class="frow"><span class="fk">状态</span><span class="fv">' + esc(c['状态'] || '') + '</span></div>';
    html += '<div class="frow"><span class="fk">关系</span><span class="fv">' + esc(c['与User关系'] || '') + '</span></div>';
    html += '<div class="frow"><span class="fk">简介</span><span class="fv">' + esc(c['角色简介'] || '') + '</span></div>';
    html += '<div class="frow"><span class="fk">想法</span><span class="fv">' + esc(c['当前内心想法'] || '') + '</span></div>';

    html += '<div class="gtitle">性格</div>' + renderKvRecord(c['性格']);

    html += '<div class="gtitle">身体信息</div>';
    html += '<div class="frow"><span class="fk">体型</span><span class="fv">年龄 ' + esc(body['年龄'] || '') + ' · 身高 ' + esc(body['身高'] || '') + ' cm · 体重 ' + esc(body['体重'] || '') + ' kg</span></div>';
    html += '<div class="frow"><span class="fk">外貌</span><span class="fv">' + esc(body['外貌描述'] || '') + '</span></div>';
    if (body['色气点']) html += '<div class="frow"><span class="fk">色气点</span><span class="fv">' + esc(body['色气点']) + '</span></div>';

    html += '<div class="gtitle">穿搭</div>';
    html += '<div class="sub">外穿</div>' + renderItemRecord(outfit['外穿']);
    html += '<div class="sub">内搭</div>' + renderItemRecord(outfit['内搭']);
    html += '<div class="sub">装饰</div>' + renderItemRecord(outfit['装饰']);
    if (outfit['色气点']) html += '<div class="frow"><span class="fk">色气点</span><span class="fv">' + esc(outfit['色气点']) + '</span></div>';

    html += '<div class="gtitle">性爱观念</div>';
    html += '<div class="frow"><span class="fk">性爱观</span><span class="fv">' + esc(sex['性爱观'] || '') + '</span></div>';
    html += '<div class="frow"><span class="fk">接受条件</span><span class="fv">' + esc(sex['接受条件'] || '') + '</span></div>';
    html += '<div class="frow"><span class="fk">偏好</span><span class="fv">' + esc(sex['偏好'] || '') + '</span></div>';

    html += '<div class="gtitle">携带物品</div>' + renderItemRecord(c['携带物品']);

    return html;
  }

  function render() {
    var d = getMvuData();

    var t = d['游戏时间'] || {};
    var timeStr = safeGet(t['纪历体系']) + ' ' +
      safeGet(t['年']) + '-' + safeGet(t['月']) + '-' + safeGet(t['日']) + ' ' +
      safeGet(t['时']) + ':' + safeGet(t['分']);
    document.getElementById('info-time').textContent = timeStr;

    var meta = d['元信息'] || {};
    document.getElementById('stage').textContent = safeGet(meta['当前阶段'], '—');
    document.getElementById('info-world').textContent = safeGet(meta['世界类型']);
    document.getElementById('info-progress').textContent = safeGet(meta['进度']);

    var scene = d['当前场景'] || {};
    document.getElementById('scene-location').textContent = safeGet(scene['所在地点']);
    document.getElementById('scene-atmosphere').textContent = safeGet(scene['环境氛围']);
    document.getElementById('scene-people').textContent = safeGet(scene['人员动态']);

    var surprise = d['可能意外'] || {};
    document.getElementById('surprise-person').textContent = safeGet(surprise['可能的人']);
    document.getElementById('surprise-result').textContent = safeGet(surprise['可能的结果']);

    var chr = d['角色档案'] || {};
    var keys = Object.keys(chr);
    var listEl = document.getElementById('char-list');

    if (keys.length === 0) {
      listEl.innerHTML = '<div class="empty">暂无出场角色</div>';
    } else {
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var c = chr[key] || {};
        var name = c['姓名'] || '未知';
        var state = c['状态'] || '出场中';
        var aff = Number(c['数值'] && c['数值']['好感度']);
        if (isNaN(aff)) aff = 0;
        var rel = c['与User关系'] || '';
        var pct = affinityPercent(aff);
        var acls = affinityClass(aff);
        var isCollapsed = !!collapsedMap[key];
        var offCls = (state === '暂时退场') ? ' off' : '';
        var relSub = rel ? '<span class="rel">' + esc(rel) + '</span>' : '';

        html += '<div class="char-card' + (isCollapsed ? ' collapsed' : '') + '" data-key="' + esc(key) + '">'
          + '<div class="char-header">'
          +   '<div class="char-name">' + esc(name) + relSub + '</div>'
          +   '<div class="char-meta">'
          +     '<span class="char-status' + offCls + '">' + esc(state) + '</span>'
          +     '<span class="char-aff ' + acls + '">' + aff + '</span>'
          +     '<span class="toggle">▼</span>'
          +   '</div>'
          + '</div>'
          + '<div class="char-details">'
          +   '<div class="aff-row">'
          +     '<span class="aff-label">好感度</span>'
          +     '<div class="aff-bar"><div class="aff-fill ' + acls + '" style="width:' + pct + '%"></div></div>'
          +     '<span class="aff-val">' + aff + '</span>'
          +   '</div>'
          +   buildCharDetails(c)
          + '</div>'
          + '</div>';
      }
      listEl.innerHTML = html;
    }
  }

  var CONFIG_KEY = 'tavern_second_api_v1';
  var config = { url: '', key: '', model: '', useTavernMain: true };

  function loadConfig() {
    try {
      var s = localStorage.getItem(CONFIG_KEY);
      if (s) {
        var o = JSON.parse(s);
        if (o) {
          config.url = o.url || '';
          config.key = o.key || '';
          config.model = o.model || '';
          config.useTavernMain = (o.useTavernMain !== false);
        }
      }
    } catch (e) { /* ignore */ }
  }

  function saveConfig() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) { /* ignore */ }
  }

  function syncConfigUI() {
    document.getElementById('cfg-use-main').checked = config.useTavernMain;
    document.getElementById('cfg-url').value = config.url;
    document.getElementById('cfg-key').value = config.key;
    document.getElementById('cfg-model').value = config.model;
    document.getElementById('cfg-custom').style.display = config.useTavernMain ? 'none' : 'block';
  }

  function callSecondApi(systemPrompt, userContent) {
    var fn = getGlobalFn('generateRaw');
    if (!fn) return Promise.reject(new Error('generateRaw 不可用'));

    var payload = {
      user_input: '',
      should_stream: false,
      should_silence: true,
      max_chat_history: 0,
      automatic_trigger: true,
      ordered_prompts: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ]
    };

    if (!config.useTavernMain) {
      if (!String(config.url || '').trim()) return Promise.reject(new Error('请填写第二 API URL'));
      if (!String(config.key || '').trim()) return Promise.reject(new Error('请填写第二 API Key'));
      payload.custom_api = {
        apiurl: String(config.url).trim(),
        key: String(config.key).trim(),
        source: 'openai'
      };
      if (String(config.model || '').trim()) payload.custom_api.model = String(config.model).trim();
    }

    return Promise.resolve(fn(payload));
  }

  var BEAUTIFY_SYSTEM = '你是正文美化助手。以用户消息为准，不得擅自增减事实、对白原句与顺序；不得删除或改写 HTML 注释；所有玩家可见文案须为简体中文；除 <BeautifiedMaintext> 标签外不要输出任何文字。请将美化后的正文完整包裹在 <BeautifiedMaintext></BeautifiedMaintext> 中。';
  var beautifyBusy = false;

  function setStatus(elId, msg, isError) {
    var el = document.getElementById(elId);
    el.textContent = msg || '';
    el.className = 'tool-status' + (isError ? ' error' : '');
  }

  function beautifyMaintext() {
    if (beautifyBusy) return;
    beautifyBusy = true;
    document.getElementById('btn-beautify').disabled = true;
    setStatus('beautify-status', '正在美化…');

    var getMsgs = getGlobalFn('getChatMessages');
    var getCur = getGlobalFn('getCurrentMessageId');
    if (!getMsgs) {
      setStatus('beautify-status', '失败：getChatMessages 不可用', true);
      beautifyBusy = false;
      document.getElementById('btn-beautify').disabled = false;
      return;
    }

    var curId = getCur ? getCur() : 'latest';
    var original = '';

    Promise.resolve(getMsgs(curId))
      .then(function (msgs) {
        if (!msgs || !msgs.length) throw new Error('未读取到当前消息');
        original = String(msgs[0].message || '');
        if (!original.trim()) throw new Error('当前消息为空');
        return callSecondApi(BEAUTIFY_SYSTEM, original);
      })
      .then(function (resp) {
        var m = String(resp || '').match(/<BeautifiedMaintext>([\s\S]*?)<\/BeautifiedMaintext>/i);
        if (!m || !m[1].trim()) throw new Error('响应未包含 <BeautifiedMaintext>');
        var beautified = m[1].trim();

        var setMsgs = getGlobalFn('setChatMessages');
        if (!setMsgs) throw new Error('setChatMessages 不可用');
        var msgId = curId;

        return Promise.resolve(setMsgs([{ message_id: msgId, message: beautified }], { refresh: 'affected' }))
          .then(function () {
            var ST = window.SillyTavern || (window.parent && window.parent.SillyTavern);
            if (ST && typeof ST.saveChat === 'function') {
              try { ST.saveChat(); } catch (e) { /* ignore */ }
            }
          });
      })
      .then(function () {
        setStatus('beautify-status', '正文已美化并替换');
      })
      .catch(function (e) {
        setStatus('beautify-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        beautifyBusy = false;
        document.getElementById('btn-beautify').disabled = false;
      });
  }

  var VARIABLE_SYSTEM = '你是变量处理助手。根据提供的当前变量数据（JSON），判断哪些变量需要更新，并生成 JSON Patch 风格的更新数组。只输出 <VariablePatch> 标签包裹的 JSON 数组（形如 [{"op":"replace","path":"/...","value":"..."}]），不要输出其他文字。';
  var variableBusy = false;

  function processVariable() {
    if (variableBusy) return;
    variableBusy = true;
    document.getElementById('btn-variable').disabled = true;
    setStatus('variable-status', '正在处理…');
    document.getElementById('patch-box').className = 'patch-box';
    document.getElementById('patch-text').value = '';

    var d = getMvuData();
    if (!d || Object.keys(d).length === 0) {
      setStatus('variable-status', '失败：未读取到变量数据', true);
      variableBusy = false;
      document.getElementById('btn-variable').disabled = false;
      return;
    }

    callSecondApi(VARIABLE_SYSTEM, JSON.stringify(d, null, 2))
      .then(function (resp) {
        var m = String(resp || '').match(/<VariablePatch>([\s\S]*?)<\/VariablePatch>/i);
        if (!m) throw new Error('响应未包含 <VariablePatch>');
        document.getElementById('patch-text').value = m[1].trim();
        document.getElementById('patch-box').className = 'patch-box open';
        setStatus('variable-status', '已生成变量更新建议');
      })
      .catch(function (e) {
        setStatus('variable-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        variableBusy = false;
        document.getElementById('btn-variable').disabled = false;
      });
  }

  function copyVariable() {
    var txt = document.getElementById('patch-text').value;
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
    }
  }

  function bindEvents() {
    document.getElementById('gear-btn').addEventListener('click', function () {
      document.getElementById('settings').classList.toggle('open');
    });

    document.getElementById('cfg-use-main').addEventListener('change', function () {
      config.useTavernMain = this.checked;
      saveConfig();
      syncConfigUI();
    });
    document.getElementById('cfg-url').addEventListener('change', function () { config.url = this.value; saveConfig(); });
    document.getElementById('cfg-key').addEventListener('change', function () { config.key = this.value; saveConfig(); });
    document.getElementById('cfg-model').addEventListener('change', function () { config.model = this.value; saveConfig(); });

    document.getElementById('char-list').addEventListener('click', function (e) {
      var header = e.target.closest ? e.target.closest('.char-header') : null;
      if (!header) return;
      var card = header.closest ? header.closest('.char-card') : null;
      if (!card) return;
      var key = card.getAttribute('data-key');
      if (card.classList.contains('collapsed')) {
        delete collapsedMap[key];
      } else {
        collapsedMap[key] = true;
      }
      card.classList.toggle('collapsed');
    });

    document.getElementById('btn-beautify').addEventListener('click', beautifyMaintext);
    document.getElementById('btn-variable').addEventListener('click', processVariable);
    document.getElementById('btn-copy').addEventListener('click', copyVariable);
  }

  function init() {
    try {
      loadConfig();
      syncConfigUI();
      bindEvents();
      render();
      setInterval(render, 5000);
    } catch (e) { /* ignore */ }
  }

  if (typeof $ === 'function') {
    $(function () { init(); });
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
</html>
