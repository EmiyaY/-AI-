<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态栏 · 实时变量</title>
  <style>
    /* ===== 基础（适配容器宽度，不产生横向滚动） ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 6px 0;
    }

    /* ===== 状态栏卡片 ===== */
    .status-root {
      width: 100%;
      max-width: 560px;
      border: 1px solid #2a3247;
      border-radius: 12px;
      background: linear-gradient(180deg, #1a2030 0%, #151a26 100%);
      color: #e2e8f0;
      font-size: 13px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ===== 头部 ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #2a3247;
      background: rgba(91, 141, 239, 0.08);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3fb27f;
      box-shadow: 0 0 6px #3fb27f;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }
    .stage {
      font-size: 11px;
      color: #5b8def;
      border: 1px solid rgba(91, 141, 239, 0.4);
      border-radius: 10px;
      padding: 1px 8px;
    }
    .gear {
      background: none;
      border: 1px solid #2a3247;
      border-radius: 6px;
      color: #9aa8c0;
      font-size: 13px;
      cursor: pointer;
      padding: 2px 8px;
      line-height: 1.4;
    }
    .gear:hover {
      color: #e2e8f0;
      border-color: #3a4358;
    }

    /* ===== 第二 API 设置面板 ===== */
    .settings {
      display: none;
      padding: 10px 14px;
      border-bottom: 1px solid #2a3247;
      background: rgba(232, 160, 76, 0.04);
    }
    .settings.open {
      display: block;
    }
    .settings-title {
      font-size: 12px;
      font-weight: 600;
      color: #e8a04c;
      margin-bottom: 8px;
    }
    .set-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
      color: #9aa8c0;
    }
    .set-field span {
      flex: 0 0 60px;
    }
    .set-field input[type="text"],
    .set-field input[type="password"] {
      flex: 1;
      background: #1d2433;
      border: 1px solid #2a3247;
      border-radius: 6px;
      color: #e2e8f0;
      padding: 5px 8px;
      font-size: 12px;
    }
    .set-field input:focus {
      outline: none;
      border-color: #5b8def;
    }

    /* ===== 时间行 ===== */
    .time-row {
      padding: 8px 14px;
      font-family: "SF Mono", "Consolas", monospace;
      font-size: 12px;
      color: #9aa8c0;
      border-bottom: 1px solid #242c3d;
    }

    /* ===== 分区 ===== */
    .section {
      padding: 8px 0;
    }
    .section-title {
      padding: 2px 14px 6px;
      font-size: 11px;
      font-weight: 600;
      color: #7d8ca8;
      letter-spacing: 0.5px;
    }
    .item {
      display: flex;
      padding: 3px 14px;
      gap: 10px;
    }
    .item .label {
      flex: 0 0 42px;
      color: #7d8ca8;
    }
    .item .val {
      flex: 1;
      color: #cbd5e6;
      word-break: break-word;
    }

    /* ===== 可能意外（高亮区块） ===== */
    .section.surprise {
      border-top: 1px solid #2a3247;
      border-bottom: 1px solid #2a3247;
      background: rgba(232, 160, 76, 0.05);
    }
    .section.surprise .section-title {
      color: #e8a04c;
    }
    .section.surprise .label {
      color: #c08a4e;
    }
    .section.surprise .val {
      color: #f0c48a;
    }

    /* ===== 角色卡片 ===== */
    .empty {
      padding: 4px 14px 10px;
      color: #6b7a90;
      font-size: 12px;
    }
    .char-card {
      margin: 6px 14px;
      padding: 10px;
      border: 1px solid #2a3247;
      border-radius: 8px;
      background: #1d2433;
    }
    .char-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .char-name {
      font-weight: 600;
      color: #e2e8f0;
    }
    .badge {
      font-size: 11px;
      color: #3fb27f;
      border: 1px solid rgba(63, 178, 127, 0.4);
      border-radius: 8px;
      padding: 0 7px;
    }
    .badge.off {
      color: #6b7a90;
      border-color: rgba(107, 122, 144, 0.4);
    }
    .char-meta {
      display: flex;
      gap: 12px;
      font-size: 12px;
      color: #9aa8c0;
      margin-bottom: 6px;
    }
    .char-meta .rel {
      color: #7d8ca8;
    }
    .aff-bar {
      height: 4px;
      border-radius: 2px;
      background: #2a3247;
      overflow: hidden;
    }
    .aff-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* ===== 工具区 ===== */
    .tools {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid #2a3247;
    }
    .tool-btn {
      flex: 1;
      padding: 8px 0;
      background: linear-gradient(180deg, #6b9bff 0%, #4a7de8 100%);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .tool-btn:hover {
      filter: brightness(1.08);
    }
    .tool-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .tool-btn.small {
      flex: 0 0 auto;
      padding: 6px 14px;
      font-size: 12px;
    }
    .tool-status {
      padding: 0 14px 8px;
      font-size: 12px;
      color: #3fb27f;
      word-break: break-word;
    }
    .tool-status.error {
      color: #e06c75;
    }
    .patch-box {
      display: none;
      padding: 0 14px 10px;
    }
    .patch-box.open {
      display: block;
    }
    .patch-box textarea {
      width: 100%;
      background: #1d2433;
      border: 1px solid #2a3247;
      border-radius: 6px;
      color: #cbd5e6;
      font-size: 12px;
      padding: 8px;
      margin-bottom: 6px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="status-root">
    <!-- 头部 -->
    <div class="header">
      <span class="dot"></span>
      <span class="title">状态栏</span>
      <span class="stage" id="stage">—</span>
      <button class="gear" id="gear-btn" type="button" title="设置">⚙</button>
    </div>

    <!-- 第二 API 设置面板 -->
    <div class="settings" id="settings">
      <div class="settings-title">第二 API 设置</div>
      <label class="set-field">
        <span>复用酒馆 API</span>
        <input id="cfg-use-main" type="checkbox" checked>
      </label>
      <div id="cfg-custom" style="display:none;">
        <label class="set-field">
          <span>API URL</span>
          <input id="cfg-url" type="text" placeholder="https://api.openai.com/v1">
        </label>
        <label class="set-field">
          <span>API Key</span>
          <input id="cfg-key" type="password" placeholder="sk-...">
        </label>
        <label class="set-field">
          <span>模型</span>
          <input id="cfg-model" type="text" placeholder="如 gpt-4o-mini">
        </label>
      </div>
    </div>

    <!-- 时间行 -->
    <div class="time-row" id="time-row">—</div>

    <!-- 当前场景 -->
    <div class="section">
      <div class="section-title">当前场景</div>
      <div class="item"><span class="label">地点</span><span class="val" id="scene-location">—</span></div>
      <div class="item"><span class="label">环境</span><span class="val" id="scene-atmosphere">—</span></div>
      <div class="item"><span class="label">人员</span><span class="val" id="scene-people">—</span></div>
    </div>

    <!-- 可能意外 -->
    <div class="section surprise">
      <div class="section-title">可能意外</div>
      <div class="item"><span class="label">人</span><span class="val" id="surprise-person">—</span></div>
      <div class="item"><span class="label">结果</span><span class="val" id="surprise-result">—</span></div>
    </div>

    <!-- 角色 -->
    <div class="section">
      <div class="section-title">角色</div>
      <div id="char-list"></div>
    </div>

    <!-- 工具区 -->
    <div class="tools">
      <button class="tool-btn" id="btn-beautify" type="button">美化正文</button>
      <button class="tool-btn" id="btn-variable" type="button">处理变量</button>
    </div>
    <div class="tool-status" id="beautify-status"></div>
    <div class="tool-status" id="variable-status"></div>

    <!-- Patch 结果框 -->
    <div class="patch-box" id="patch-box">
      <textarea id="patch-text" readonly rows="6"></textarea>
      <button class="tool-btn small" id="btn-copy" type="button">复制 Patch</button>
    </div>
  </div>

  <script>
  /* ================================================================
     状态栏 · 实时变量（原生 HTML，符合前端美化规范）
     ================================================================ */

  /* ===== 工具函数 ===== */

  /* 空值兜底 */
  function safeGet(v, def) {
    if (v === undefined || v === null || v === '') return (def === undefined ? '—' : def);
    if (Array.isArray(v)) return v.length ? v[0] : (def === undefined ? '—' : def);
    if (typeof v === 'object') return (def === undefined ? '—' : def);
    return v;
  }

  /* 获取全局函数（兼容 iframe / parent） */
  function getGlobalFn(name) {
    try { if (window.parent && typeof window.parent[name] === 'function') return window.parent[name]; } catch (e) { /* ignore */ }
    if (typeof window[name] === 'function') return window[name];
    return null;
  }

  /* 读取 MVU 变量（主路径 getVariables，回退 getChatMessages 读消息 data） */
  function getMvuData() {
    /* 方式1：MVU 官方 API */
    try {
      var TH = window.TavernHelper || (window.parent && window.parent.TavernHelper);
      if (TH && typeof TH.getVariables === 'function') {
        var v = TH.getVariables({ type: 'message', message_id: 'latest' });
        if (v) return (v.display_data || v.stat_data) || {};
      }
    } catch (e) { /* ignore */ }

    /* 方式2：getChatMessages 读消息对象 data（文档要求方式） */
    try {
      var getMsgs = getGlobalFn('getChatMessages');
      var getCur = getGlobalFn('getCurrentMessageId');
      if (getMsgs) {
        var id = getCur ? getCur() : 'latest';
        var msgs = getMsgs(id);
        if (msgs && msgs.length) {
          var d = (msgs[0] && msgs[0].data) || {};
          return (d.display_data || d.stat_data) || {};
        }
      }
    } catch (e) { /* ignore */ }

    return {};
  }

  /* ===== 状态栏渲染 ===== */

  function affinityPercent(n) {
    return Math.round(((n + 100) / 200) * 100);
  }
  function affinityColor(n) {
    if (n > 20) return '#e06c75';
    if (n >= 0) return '#e8a04c';
    return '#5b8def';
  }

  function render() {
    var d = getMvuData();

    /* 时间 */
    var t = d['游戏时间'] || {};
    var timeStr = safeGet(t['纪历体系']) + ' ' +
      safeGet(t['年']) + '-' + safeGet(t['月']) + '-' + safeGet(t['日']) + ' ' +
      safeGet(t['时']) + ':' + safeGet(t['分']);
    document.getElementById('time-row').textContent = timeStr;

    /* 阶段 */
    var meta = d['元信息'] || {};
    document.getElementById('stage').textContent = safeGet(meta['当前阶段'], '—');

    /* 当前场景 */
    var scene = d['当前场景'] || {};
    document.getElementById('scene-location').textContent = safeGet(scene['所在地点']);
    document.getElementById('scene-atmosphere').textContent = safeGet(scene['环境氛围']);
    document.getElementById('scene-people').textContent = safeGet(scene['人员动态']);

    /* 可能意外 */
    var surprise = d['可能意外'] || {};
    document.getElementById('surprise-person').textContent = safeGet(surprise['可能的人']);
    document.getElementById('surprise-result').textContent = safeGet(surprise['可能的结果']);

    /* 角色列表 */
    var chr = d['角色档案'] || {};
    var keys = Object.keys(chr);
    var listEl = document.getElementById('char-list');
    if (keys.length === 0) {
      listEl.innerHTML = '<div class="empty">暂无出场角色</div>';
    } else {
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        var c = chr[keys[i]] || {};
        var name = safeGet(c['姓名'], '未知');
        var state = safeGet(c['状态'], '出场中');
        var aff = Number(safeGet((c['数值'] || {})['好感度'], 0));
        if (isNaN(aff)) aff = 0;
        var rel = safeGet(c['与User关系'], '');
        var pct = affinityPercent(aff);
        var color = affinityColor(aff);
        var offCls = (state === '暂时退场') ? ' off' : '';
        html += '<div class="char-card">'
          + '<div class="char-head"><span class="char-name"></span><span class="badge' + offCls + '"></span></div>'
          + '<div class="char-meta"><span class="aff">好感 ' + aff + '</span><span class="rel"></span></div>'
          + '<div class="aff-bar"><div class="aff-fill"></div></div>'
          + '</div>';
      }
      listEl.innerHTML = html;

      /* 填充角色名/状态/关系/进度条（用 textContent 防注入） */
      var cards = listEl.querySelectorAll('.char-card');
      for (var j = 0; j < cards.length; j++) {
        var cj = chr[keys[j]] || {};
        var nm = safeGet(cj['姓名'], '未知');
        var st = safeGet(cj['状态'], '出场中');
        var af = Number(safeGet((cj['数值'] || {})['好感度'], 0));
        if (isNaN(af)) af = 0;
        var rl = safeGet(cj['与User关系'], '');
        cards[j].querySelector('.char-name').textContent = nm;
        var badge = cards[j].querySelector('.badge');
        badge.textContent = st;
        badge.className = 'badge' + ((st === '暂时退场') ? ' off' : '');
        cards[j].querySelector('.rel').textContent = rl;
        var fill = cards[j].querySelector('.aff-fill');
        fill.style.width = affinityPercent(af) + '%';
        fill.style.background = affinityColor(af);
      }
    }
  }

  /* ===== 第二 API 配置 ===== */

  var CONFIG_KEY = 'tavern_second_api_v1';
  var config = { url: '', key: '', model: '', useTavernMain: true };

  function loadConfig() {
    try {
      var s = localStorage.getItem(CONFIG_KEY);
      if (s) {
        var o = JSON.parse(s);
        if (o) {
          config.url = o.url || '';
          config.key = o.key || '';
          config.model = o.model || '';
          config.useTavernMain = (o.useTavernMain !== false);
        }
      }
    } catch (e) { /* ignore */ }
  }

  function saveConfig() {
    try {
      localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    } catch (e) { /* ignore */ }
  }

  function syncConfigUI() {
    document.getElementById('cfg-use-main').checked = config.useTavernMain;
    document.getElementById('cfg-url').value = config.url;
    document.getElementById('cfg-key').value = config.key;
    document.getElementById('cfg-model').value = config.model;
    document.getElementById('cfg-custom').style.display = config.useTavernMain ? 'none' : 'block';
  }

  /* ===== 第二 API 调用 ===== */

  function callSecondApi(systemPrompt, userContent) {
    var fn = getGlobalFn('generateRaw');
    if (!fn) return Promise.reject(new Error('generateRaw 不可用（需酒馆助手或对应环境）'));

    var payload = {
      user_input: '',
      should_stream: false,
      should_silence: true,
      max_chat_history: 0,
      automatic_trigger: true,
      ordered_prompts: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ]
    };

    if (!config.useTavernMain) {
      if (!String(config.url || '').trim()) return Promise.reject(new Error('请填写第二 API URL'));
      if (!String(config.key || '').trim()) return Promise.reject(new Error('请填写第二 API Key'));
      payload.custom_api = {
        apiurl: String(config.url).trim(),
        key: String(config.key).trim(),
        source: 'openai'
      };
      if (String(config.model || '').trim()) payload.custom_api.model = String(config.model).trim();
    }

    return Promise.resolve(fn(payload));
  }

  /* ===== 正文美化 ===== */

  var BEAUTIFY_SYSTEM = '你是正文美化助手。以用户消息为准，不得擅自增减事实、对白原句与顺序；不得删除或改写 HTML 注释；所有玩家可见文案须为简体中文；除 <BeautifiedMaintext> 标签外不要输出任何文字。请将美化后的正文完整包裹在 <BeautifiedMaintext></BeautifiedMaintext> 中。';
  var beautifyBusy = false;

  function setStatus(elId, msg, isError) {
    var el = document.getElementById(elId);
    el.textContent = msg || '';
    el.className = 'tool-status' + (isError ? ' error' : '');
  }

  function beautifyMaintext() {
    if (beautifyBusy) return;
    beautifyBusy = true;
    document.getElementById('btn-beautify').disabled = true;
    setStatus('beautify-status', '正在美化…');

    var getMsgs = getGlobalFn('getChatMessages');
    var getCur = getGlobalFn('getCurrentMessageId');
    if (!getMsgs) {
      setStatus('beautify-status', '失败：getChatMessages 不可用', true);
      beautifyBusy = false;
      document.getElementById('btn-beautify').disabled = false;
      return;
    }

    var curId = getCur ? getCur() : 'latest';
    var original = '';

    Promise.resolve(getMsgs(curId))
      .then(function (msgs) {
        if (!msgs || !msgs.length) throw new Error('未读取到当前消息');
        original = String(msgs[0].message || '');
        if (!original.trim()) throw new Error('当前消息为空');
        return callSecondApi(BEAUTIFY_SYSTEM, original);
      })
      .then(function (resp) {
        var m = String(resp || '').match(/<BeautifiedMaintext>([\s\S]*?)<\/BeautifiedMaintext>/i);
        if (!m || !m[1].trim()) throw new Error('响应未包含 <BeautifiedMaintext>');
        var beautified = m[1].trim();

        var setMsgs = getGlobalFn('setChatMessages');
        if (!setMsgs) throw new Error('setChatMessages 不可用');
        var msgId = curId;

        return Promise.resolve(setMsgs([{ message_id: msgId, message: beautified }], { refresh: 'affected' }))
          .then(function () {
            var ST = window.SillyTavern || (window.parent && window.parent.SillyTavern);
            if (ST && typeof ST.saveChat === 'function') {
              try { ST.saveChat(); } catch (e) { /* ignore */ }
            }
          });
      })
      .then(function () {
        setStatus('beautify-status', '正文已美化并替换');
      })
      .catch(function (e) {
        setStatus('beautify-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        beautifyBusy = false;
        document.getElementById('btn-beautify').disabled = false;
      });
  }

  /* ===== 变量处理 ===== */

  var VARIABLE_SYSTEM = '你是变量处理助手。根据提供的当前变量数据（JSON），判断哪些变量需要更新，并生成 JSON Patch 风格的更新数组。只输出 <VariablePatch> 标签包裹的 JSON 数组（形如 [{"op":"replace","path":"/...","value":"..."}]），不要输出其他文字。';
  var variableBusy = false;

  function processVariable() {
    if (variableBusy) return;
    variableBusy = true;
    document.getElementById('btn-variable').disabled = true;
    setStatus('variable-status', '正在处理…');
    document.getElementById('patch-box').className = 'patch-box';
    document.getElementById('patch-text').value = '';

    var d = getMvuData();
    if (!d || Object.keys(d).length === 0) {
      setStatus('variable-status', '失败：未读取到变量数据', true);
      variableBusy = false;
      document.getElementById('btn-variable').disabled = false;
      return;
    }

    callSecondApi(VARIABLE_SYSTEM, JSON.stringify(d, null, 2))
      .then(function (resp) {
        var m = String(resp || '').match(/<VariablePatch>([\s\S]*?)<\/VariablePatch>/i);
        if (!m) throw new Error('响应未包含 <VariablePatch>');
        document.getElementById('patch-text').value = m[1].trim();
        document.getElementById('patch-box').className = 'patch-box open';
        setStatus('variable-status', '已生成变量更新建议');
      })
      .catch(function (e) {
        setStatus('variable-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        variableBusy = false;
        document.getElementById('btn-variable').disabled = false;
      });
  }

  function copyVariable() {
    var txt = document.getElementById('patch-text').value;
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
    }
  }

  /* ===== 事件绑定 & 初始化 ===== */

  function bindEvents() {
    document.getElementById('gear-btn').addEventListener('click', function () {
      var el = document.getElementById('settings');
      el.classList.toggle('open');
    });

    document.getElementById('cfg-use-main').addEventListener('change', function () {
      config.useTavernMain = this.checked;
      saveConfig();
      syncConfigUI();
    });
    document.getElementById('cfg-url').addEventListener('change', function () { config.url = this.value; saveConfig(); });
    document.getElementById('cfg-key').addEventListener('change', function () { config.key = this.value; saveConfig(); });
    document.getElementById('cfg-model').addEventListener('change', function () { config.model = this.value; saveConfig(); });

    document.getElementById('btn-beautify').addEventListener('click', beautifyMaintext);
    document.getElementById('btn-variable').addEventListener('click', processVariable);
    document.getElementById('btn-copy').addEventListener('click', copyVariable);
  }

  function init() {
    try {
      loadConfig();
      syncConfigUI();
      bindEvents();
      render();
      setInterval(render, 5000);
    } catch (e) {
      /* ignore */
    }
  }

  /* 加载时机：用 jQuery ready（文档要求），回退 DOMContentLoaded */
  if (typeof $ === 'function') {
    $(function () { init(); });
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
</html>
