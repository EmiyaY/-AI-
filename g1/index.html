<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态栏 · 实时变量</title>
  <style>
    /* ===== 基础（适配容器宽度，不产生横向滚动） ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 8px 0;
    }

    /* ===== 状态栏主容器（紫色渐变 + 浮动） ===== */
    .status-root {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 12px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #2c3e50;
      font-size: 12px;
      line-height: 1.6;
      animation: float 3.5s ease-in-out infinite;
    }

    /* 浮动动画 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    /* ===== 头部 ===== */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px 10px;
      color: #fff;
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7dffb0;
      box-shadow: 0 0 8px rgba(125, 255, 176, 0.9);
    }
    .title {
      font-weight: 700;
      font-size: 15px;
      flex: 1;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .stage {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 2px 10px;
      font-weight: 600;
    }
    .gear {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      padding: 2px 9px;
      line-height: 1.4;
    }
    .gear:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* ===== 第二 API 设置面板 ===== */
    .settings {
      display: none;
      padding: 10px 12px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .settings.open {
      display: block;
    }
    .settings-title {
      font-size: 12px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 8px;
    }
    .set-field {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 12px;
      color: #4a5568;
    }
    .set-field span {
      flex: 0 0 64px;
      font-weight: 600;
    }
    .set-field input[type="text"],
    .set-field input[type="password"] {
      flex: 1;
      background: #f1f3f8;
      border: 1px solid #d5dbe8;
      border-radius: 6px;
      color: #2c3e50;
      padding: 6px 9px;
      font-size: 12px;
    }
    .set-field input:focus {
      outline: none;
      border-color: #667eea;
    }

    /* ===== 白色信息卡片 ===== */
    .card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 10px;
      margin-bottom: 10px;
      padding: 10px 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .card-title {
      font-size: 12px;
      font-weight: 700;
      color: #667eea;
      margin-bottom: 8px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.35);
      padding-bottom: 4px;
    }
    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }
    .info-label {
      font-weight: 600;
      color: #4a5568;
      flex: 0 0 auto;
    }
    .info-value {
      font-weight: 700;
      color: #667eea;
      text-align: right;
      word-break: break-word;
    }

    /* 意外卡（高亮橙） */
    .card.surprise {
      background: rgba(255, 247, 237, 0.95);
      border: 1px solid rgba(245, 124, 0, 0.25);
    }
    .card.surprise .card-title {
      color: #f57c00;
      border-bottom-color: rgba(245, 124, 0, 0.3);
    }
    .card.surprise .info-value {
      color: #e65100;
    }

    /* ===== 角色卡片（可折叠） ===== */
    .char-card {
      background: rgba(255, 255, 255, 0.94);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }
    .char-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 9px 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .char-name {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .char-name .emoji {
      font-size: 16px;
    }
    .char-name .rel-sub {
      font-size: 10px;
      font-weight: 400;
      opacity: 0.85;
    }
    .char-head-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      font-size: 10px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      padding: 1px 8px;
      font-weight: 600;
    }
    .badge.off {
      background: rgba(0, 0, 0, 0.18);
      opacity: 0.7;
    }
    .toggle-icon {
      font-size: 13px;
      transition: transform 0.3s;
    }
    .char-card.collapsed .toggle-icon {
      transform: rotate(-90deg);
    }

    /* 角色详情（折叠过渡） */
    .char-details {
      padding: 10px 13px;
      max-height: 600px;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease;
    }
    .char-card.collapsed .char-details {
      max-height: 0;
      padding: 0 13px;
    }

    /* ===== 好感度进度条 ===== */
    .stat-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-size: 11px;
    }
    .stat-name {
      font-weight: 600;
      color: #4a5568;
    }
    .stat-value {
      font-weight: 700;
      color: #667eea;
    }
    .progress-bar {
      height: 18px;
      background: #e8ecf3;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.6s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    .progress-fill::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shine 2.2s infinite;
    }
    @keyframes shine {
      to { left: 100%; }
    }
    /* 好感度颜色 */
    .aff-high { background: linear-gradient(90deg, #ff6b9d, #c471ed); }
    .aff-mid { background: linear-gradient(90deg, #ffb74d, #ff9800); }
    .aff-low { background: linear-gradient(90deg, #42a5f5, #1976d2); }

    /* 角色详情文字行 */
    .detail-row {
      padding: 2px 0;
      font-size: 11px;
      color: #4a5568;
    }
    .detail-row .dl {
      font-weight: 700;
      color: #667eea;
    }

    .empty {
      padding: 6px;
      color: #fff;
      text-align: center;
      font-size: 12px;
      opacity: 0.9;
    }

    /* ===== 工具区 ===== */
    .tools {
      display: flex;
      gap: 8px;
      padding-top: 2px;
    }
    .tool-btn {
      flex: 1;
      padding: 9px 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(240,243,250,0.95) 100%);
      border: none;
      border-radius: 8px;
      color: #667eea;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
    }
    .tool-btn:hover {
      background: #fff;
    }
    .tool-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .tool-btn.small {
      flex: 0 0 auto;
      padding: 6px 14px;
      font-size: 12px;
    }
    .tool-status {
      padding: 6px 2px 0;
      font-size: 11px;
      color: #fff;
      word-break: break-word;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .tool-status.error {
      color: #ffe0e0;
    }
    .patch-box {
      display: none;
      padding-top: 8px;
    }
    .patch-box.open {
      display: block;
    }
    .patch-box textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: #2c3e50;
      font-size: 12px;
      padding: 8px;
      margin-bottom: 6px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="status-root">
    <!-- 头部 -->
    <div class="header">
      <span class="dot"></span>
      <span class="title">状态栏</span>
      <span class="stage" id="stage">—</span>
      <button class="gear" id="gear-btn" type="button" title="设置">⚙</button>
    </div>

    <!-- 第二 API 设置面板 -->
    <div class="settings" id="settings">
      <div class="settings-title">第二 API 设置</div>
      <label class="set-field">
        <span>复用酒馆 API</span>
        <input id="cfg-use-main" type="checkbox" checked>
      </label>
      <div id="cfg-custom" style="display:none;">
        <label class="set-field">
          <span>API URL</span>
          <input id="cfg-url" type="text" placeholder="https://api.openai.com/v1">
        </label>
        <label class="set-field">
          <span>API Key</span>
          <input id="cfg-key" type="password" placeholder="sk-...">
        </label>
        <label class="set-field">
          <span>模型</span>
          <input id="cfg-model" type="text" placeholder="如 gpt-4o-mini">
        </label>
      </div>
    </div>

    <!-- 世界信息卡 -->
    <div class="card">
      <div class="card-title">🌍 世界信息</div>
      <div class="info-item"><span class="info-label">📅 时间</span><span class="info-value" id="info-time">—</span></div>
      <div class="info-item"><span class="info-label">🏷 世界</span><span class="info-value" id="info-world">—</span></div>
      <div class="info-item"><span class="info-label">🎯 进度</span><span class="info-value" id="info-progress">—</span></div>
    </div>

    <!-- 当前场景卡 -->
    <div class="card">
      <div class="card-title">📍 当前场景</div>
      <div class="info-item"><span class="info-label">地点</span><span class="info-value" id="scene-location">—</span></div>
      <div class="info-item"><span class="info-label">环境</span><span class="info-value" id="scene-atmosphere">—</span></div>
      <div class="info-item"><span class="info-label">人员</span><span class="info-value" id="scene-people">—</span></div>
    </div>

    <!-- 可能意外卡 -->
    <div class="card surprise">
      <div class="card-title">⚠️ 可能意外</div>
      <div class="info-item"><span class="info-label">人</span><span class="info-value" id="surprise-person">—</span></div>
      <div class="info-item"><span class="info-label">结果</span><span class="info-value" id="surprise-result">—</span></div>
    </div>

    <!-- 角色列表 -->
    <div id="char-list"></div>

    <!-- 工具区 -->
    <div class="tools">
      <button class="tool-btn" id="btn-beautify" type="button">✨ 美化正文</button>
      <button class="tool-btn" id="btn-variable" type="button">🔧 处理变量</button>
    </div>
    <div class="tool-status" id="beautify-status"></div>
    <div class="tool-status" id="variable-status"></div>

    <!-- Patch 结果框 -->
    <div class="patch-box" id="patch-box">
      <textarea id="patch-text" readonly rows="6"></textarea>
      <button class="tool-btn small" id="btn-copy" type="button">复制 Patch</button>
    </div>
  </div>

  <script>
  /* ================================================================
     状态栏 · 实时变量（紫色渐变美化版，参考卡视觉 + 可折叠角色卡）
     ================================================================ */

  /* ===== 工具函数 ===== */

  /* 空值兜底 */
  function safeGet(v, def) {
    if (v === undefined || v === null || v === '') return (def === undefined ? '—' : def);
    if (Array.isArray(v)) return v.length ? v[0] : (def === undefined ? '—' : def);
    if (typeof v === 'object') return (def === undefined ? '—' : def);
    return v;
  }

  /* 获取全局函数（兼容 iframe / parent） */
  function getGlobalFn(name) {
    try { if (window.parent && typeof window.parent[name] === 'function') return window.parent[name]; } catch (e) { /* ignore */ }
    if (typeof window[name] === 'function') return window[name];
    return null;
  }

  /* 读取 MVU 变量（主路径 getVariables，回退 getChatMessages 读消息 data） */
  function getMvuData() {
    try {
      var TH = window.TavernHelper || (window.parent && window.parent.TavernHelper);
      if (TH && typeof TH.getVariables === 'function') {
        var v = TH.getVariables({ type: 'message', message_id: 'latest' });
        if (v) return (v.display_data || v.stat_data) || {};
      }
    } catch (e) { /* ignore */ }

    try {
      var getMsgs = getGlobalFn('getChatMessages');
      var getCur = getGlobalFn('getCurrentMessageId');
      if (getMsgs) {
        var id = getCur ? getCur() : 'latest';
        var msgs = getMsgs(id);
        if (msgs && msgs.length) {
          var d = (msgs[0] && msgs[0].data) || {};
          return (d.display_data || d.stat_data) || {};
        }
      }
    } catch (e) { /* ignore */ }

    return {};
  }

  /* ===== 状态栏渲染 ===== */

  /* 折叠状态记录：{角色键名: true}，刷新后保留 */
  var collapsedMap = {};

  function affinityPercent(n) {
    return Math.round(((n + 100) / 200) * 100);
  }
  function affinityClass(n) {
    if (n > 20) return 'aff-high';
    if (n >= 0) return 'aff-mid';
    return 'aff-low';
  }

  function render() {
    var d = getMvuData();

    /* 世界信息 */
    var t = d['游戏时间'] || {};
    var timeStr = safeGet(t['纪历体系']) + ' ' +
      safeGet(t['年']) + '-' + safeGet(t['月']) + '-' + safeGet(t['日']) + ' ' +
      safeGet(t['时']) + ':' + safeGet(t['分']);
    document.getElementById('info-time').textContent = timeStr;

    var meta = d['元信息'] || {};
    document.getElementById('stage').textContent = safeGet(meta['当前阶段'], '—');
    document.getElementById('info-world').textContent = safeGet(meta['世界类型']);
    document.getElementById('info-progress').textContent = safeGet(meta['进度']);

    /* 当前场景 */
    var scene = d['当前场景'] || {};
    document.getElementById('scene-location').textContent = safeGet(scene['所在地点']);
    document.getElementById('scene-atmosphere').textContent = safeGet(scene['环境氛围']);
    document.getElementById('scene-people').textContent = safeGet(scene['人员动态']);

    /* 可能意外 */
    var surprise = d['可能意外'] || {};
    document.getElementById('surprise-person').textContent = safeGet(surprise['可能的人']);
    document.getElementById('surprise-result').textContent = safeGet(surprise['可能的结果']);

    /* 角色列表 */
    var chr = d['角色档案'] || {};
    var keys = Object.keys(chr);
    var listEl = document.getElementById('char-list');

    if (keys.length === 0) {
      listEl.innerHTML = '<div class="empty">暂无出场角色</div>';
    } else {
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var c = chr[key] || {};
        var name = safeGet(c['姓名'], '未知');
        var state = safeGet(c['状态'], '出场中');
        var aff = Number(safeGet((c['数值'] || {})['好感度'], 0));
        if (isNaN(aff)) aff = 0;
        var rel = safeGet(c['与User关系'], '');
        var pct = affinityPercent(aff);
        var acls = affinityClass(aff);
        var isCollapsed = !!collapsedMap[key];
        var offCls = (state === '暂时退场') ? ' off' : '';
        var relSub = rel !== '—' && rel !== '' ? ' <span class="rel-sub">(' + rel + ')</span>' : '';

        html += '<div class="char-card' + (isCollapsed ? ' collapsed' : '') + '" data-key="' + key + '">'
          + '<div class="char-header">'
          +   '<div class="char-name"><span class="emoji">👤</span><span class="nm"></span>' + relSub + '</div>'
          +   '<div class="char-head-right"><span class="badge' + offCls + '"></span><span class="toggle-icon">▼</span></div>'
          + '</div>'
          + '<div class="char-details">'
          +   '<div class="stat-label"><span class="stat-name">💝 好感度</span><span class="stat-value"></span></div>'
          +   '<div class="progress-bar"><div class="progress-fill ' + acls + '"></div></div>'
          +   '<div class="detail-row"><span class="dl">关系</span> · <span class="dr"></span></div>'
          +   '<div class="detail-row"><span class="dl">简介</span> · <span class="dd"></span></div>'
          +   '<div class="detail-row"><span class="dl">想法</span> · <span class="dt"></span></div>'
          + '</div>'
          + '</div>';
      }
      listEl.innerHTML = html;

      /* 用 textContent 填充（防注入），并恢复折叠状态 */
      var cards = listEl.querySelectorAll('.char-card');
      for (var j = 0; j < cards.length; j++) {
        var kj = keys[j];
        var cj = chr[kj] || {};
        var nm = safeGet(cj['姓名'], '未知');
        var st = safeGet(cj['状态'], '出场中');
        var af = Number(safeGet((cj['数值'] || {})['好感度'], 0));
        if (isNaN(af)) af = 0;
        var rl = safeGet(cj['与User关系'], '');
        var intro = safeGet(cj['角色简介'], '');
        var thought = safeGet(cj['当前内心想法'], '');

        var card = cards[j];
        card.querySelector('.nm').textContent = nm;
        var badge = card.querySelector('.badge');
        badge.textContent = st;
        badge.className = 'badge' + ((st === '暂时退场') ? ' off' : '');
        card.querySelector('.stat-value').textContent = af;
        var fill = card.querySelector('.progress-fill');
        fill.style.width = affinityPercent(af) + '%';
        fill.className = 'progress-fill ' + affinityClass(af);
        card.querySelector('.dr').textContent = rl;
        card.querySelector('.dd').textContent = intro;
        card.querySelector('.dt').textContent = thought;
      }
    }
  }

  /* ===== 第二 API 配置 ===== */

  var CONFIG_KEY = 'tavern_second_api_v1';
  var config = { url: '', key: '', model: '', useTavernMain: true };

  function loadConfig() {
    try {
      var s = localStorage.getItem(CONFIG_KEY);
      if (s) {
        var o = JSON.parse(s);
        if (o) {
          config.url = o.url || '';
          config.key = o.key || '';
          config.model = o.model || '';
          config.useTavernMain = (o.useTavernMain !== false);
        }
      }
    } catch (e) { /* ignore */ }
  }

  function saveConfig() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) { /* ignore */ }
  }

  function syncConfigUI() {
    document.getElementById('cfg-use-main').checked = config.useTavernMain;
    document.getElementById('cfg-url').value = config.url;
    document.getElementById('cfg-key').value = config.key;
    document.getElementById('cfg-model').value = config.model;
    document.getElementById('cfg-custom').style.display = config.useTavernMain ? 'none' : 'block';
  }

  /* ===== 第二 API 调用 ===== */

  function callSecondApi(systemPrompt, userContent) {
    var fn = getGlobalFn('generateRaw');
    if (!fn) return Promise.reject(new Error('generateRaw 不可用（需酒馆助手或对应环境）'));

    var payload = {
      user_input: '',
      should_stream: false,
      should_silence: true,
      max_chat_history: 0,
      automatic_trigger: true,
      ordered_prompts: [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userContent }
      ]
    };

    if (!config.useTavernMain) {
      if (!String(config.url || '').trim()) return Promise.reject(new Error('请填写第二 API URL'));
      if (!String(config.key || '').trim()) return Promise.reject(new Error('请填写第二 API Key'));
      payload.custom_api = {
        apiurl: String(config.url).trim(),
        key: String(config.key).trim(),
        source: 'openai'
      };
      if (String(config.model || '').trim()) payload.custom_api.model = String(config.model).trim();
    }

    return Promise.resolve(fn(payload));
  }

  /* ===== 正文美化 ===== */

  var BEAUTIFY_SYSTEM = '你是正文美化助手。以用户消息为准，不得擅自增减事实、对白原句与顺序；不得删除或改写 HTML 注释；所有玩家可见文案须为简体中文；除 <BeautifiedMaintext> 标签外不要输出任何文字。请将美化后的正文完整包裹在 <BeautifiedMaintext></BeautifiedMaintext> 中。';
  var beautifyBusy = false;

  function setStatus(elId, msg, isError) {
    var el = document.getElementById(elId);
    el.textContent = msg || '';
    el.className = 'tool-status' + (isError ? ' error' : '');
  }

  function beautifyMaintext() {
    if (beautifyBusy) return;
    beautifyBusy = true;
    document.getElementById('btn-beautify').disabled = true;
    setStatus('beautify-status', '正在美化…');

    var getMsgs = getGlobalFn('getChatMessages');
    var getCur = getGlobalFn('getCurrentMessageId');
    if (!getMsgs) {
      setStatus('beautify-status', '失败：getChatMessages 不可用', true);
      beautifyBusy = false;
      document.getElementById('btn-beautify').disabled = false;
      return;
    }

    var curId = getCur ? getCur() : 'latest';
    var original = '';

    Promise.resolve(getMsgs(curId))
      .then(function (msgs) {
        if (!msgs || !msgs.length) throw new Error('未读取到当前消息');
        original = String(msgs[0].message || '');
        if (!original.trim()) throw new Error('当前消息为空');
        return callSecondApi(BEAUTIFY_SYSTEM, original);
      })
      .then(function (resp) {
        var m = String(resp || '').match(/<BeautifiedMaintext>([\s\S]*?)<\/BeautifiedMaintext>/i);
        if (!m || !m[1].trim()) throw new Error('响应未包含 <BeautifiedMaintext>');
        var beautified = m[1].trim();

        var setMsgs = getGlobalFn('setChatMessages');
        if (!setMsgs) throw new Error('setChatMessages 不可用');
        var msgId = curId;

        return Promise.resolve(setMsgs([{ message_id: msgId, message: beautified }], { refresh: 'affected' }))
          .then(function () {
            var ST = window.SillyTavern || (window.parent && window.parent.SillyTavern);
            if (ST && typeof ST.saveChat === 'function') {
              try { ST.saveChat(); } catch (e) { /* ignore */ }
            }
          });
      })
      .then(function () {
        setStatus('beautify-status', '正文已美化并替换');
      })
      .catch(function (e) {
        setStatus('beautify-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        beautifyBusy = false;
        document.getElementById('btn-beautify').disabled = false;
      });
  }

  /* ===== 变量处理 ===== */

  var VARIABLE_SYSTEM = '你是变量处理助手。根据提供的当前变量数据（JSON），判断哪些变量需要更新，并生成 JSON Patch 风格的更新数组。只输出 <VariablePatch> 标签包裹的 JSON 数组（形如 [{"op":"replace","path":"/...","value":"..."}]），不要输出其他文字。';
  var variableBusy = false;

  function processVariable() {
    if (variableBusy) return;
    variableBusy = true;
    document.getElementById('btn-variable').disabled = true;
    setStatus('variable-status', '正在处理…');
    document.getElementById('patch-box').className = 'patch-box';
    document.getElementById('patch-text').value = '';

    var d = getMvuData();
    if (!d || Object.keys(d).length === 0) {
      setStatus('variable-status', '失败：未读取到变量数据', true);
      variableBusy = false;
      document.getElementById('btn-variable').disabled = false;
      return;
    }

    callSecondApi(VARIABLE_SYSTEM, JSON.stringify(d, null, 2))
      .then(function (resp) {
        var m = String(resp || '').match(/<VariablePatch>([\s\S]*?)<\/VariablePatch>/i);
        if (!m) throw new Error('响应未包含 <VariablePatch>');
        document.getElementById('patch-text').value = m[1].trim();
        document.getElementById('patch-box').className = 'patch-box open';
        setStatus('variable-status', '已生成变量更新建议');
      })
      .catch(function (e) {
        setStatus('variable-status', '失败：' + (e && e.message ? e.message : e), true);
      })
      .then(function () {
        variableBusy = false;
        document.getElementById('btn-variable').disabled = false;
      });
  }

  function copyVariable() {
    var txt = document.getElementById('patch-text').value;
    if (!txt) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt);
    }
  }

  /* ===== 事件绑定 & 初始化 ===== */

  function bindEvents() {
    document.getElementById('gear-btn').addEventListener('click', function () {
      document.getElementById('settings').classList.toggle('open');
    });

    document.getElementById('cfg-use-main').addEventListener('change', function () {
      config.useTavernMain = this.checked;
      saveConfig();
      syncConfigUI();
    });
    document.getElementById('cfg-url').addEventListener('change', function () { config.url = this.value; saveConfig(); });
    document.getElementById('cfg-key').addEventListener('change', function () { config.key = this.value; saveConfig(); });
    document.getElementById('cfg-model').addEventListener('change', function () { config.model = this.value; saveConfig(); });

    /* 角色卡折叠（事件委托，兼容刷新重建） */
    document.getElementById('char-list').addEventListener('click', function (e) {
      var header = e.target.closest ? e.target.closest('.char-header') : null;
      if (!header) return;
      var card = header.closest ? header.closest('.char-card') : null;
      if (!card) return;
      var key = card.getAttribute('data-key');
      var willCollapse = !card.classList.contains('collapsed');
      if (willCollapse) {
        collapsedMap[key] = true;
      } else {
        delete collapsedMap[key];
      }
      card.classList.toggle('collapsed');
    });

    document.getElementById('btn-beautify').addEventListener('click', beautifyMaintext);
    document.getElementById('btn-variable').addEventListener('click', processVariable);
    document.getElementById('btn-copy').addEventListener('click', copyVariable);
  }

  function init() {
    try {
      loadConfig();
      syncConfigUI();
      bindEvents();
      render();
      setInterval(render, 5000);
    } catch (e) {
      /* ignore */
    }
  }

  if (typeof $ === 'function') {
    $(function () { init(); });
  } else if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  </script>
</body>
</html>
